name: Repository quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install MPI toolchain
        run: sudo apt-get update && sudo apt-get install --yes openmpi-bin libopenmpi-dev

      - name: Validate parallel workloads and native source
        run: python3 scripts/validate_repository.py
